<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17243d;
        background: #f3f6fb;
        font-synthesis: none;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #f3f6fb; }
      button, input, textarea { font: inherit; }
      button { cursor: pointer; }
      .shell { width: min(100%, 920px); margin: 0 auto; padding: 24px 18px 56px; }
      .brand { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
      h1 { margin: 0; color: #10233f; font-size: clamp(1.8rem, 5vw, 2.65rem); letter-spacing: -.035em; }
      .eyebrow { margin: 0 0 5px; color: #e04d38; font-size: .78rem; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
      .subtitle { margin: 7px 0 0; color: #64748b; }
      .card { background: #fff; border: 1px solid #dfe6ef; border-radius: 18px; box-shadow: 0 12px 32px rgba(16,35,63,.08); }
      .login { width: min(100%, 460px); margin: 9vh auto 0; padding: 28px; }
      label { display: block; margin: 17px 0 7px; font-size: .9rem; font-weight: 800; }
      input, textarea {
        width: 100%; border: 1px solid #b9c4d2; border-radius: 11px; background: #fff;
        color: #17243d; padding: 13px 14px; outline: none;
      }
      input:focus, textarea:focus { border-color: #1b5c9c; box-shadow: 0 0 0 3px rgba(27,92,156,.14); }
      textarea { min-height: 120px; resize: vertical; }
      .primary, .secondary, .ghost {
        border: 0; border-radius: 11px; padding: 12px 16px; font-weight: 850;
      }
      .primary { width: 100%; margin-top: 20px; color: #fff; background: #174a7e; }
      .primary:hover { background: #103d6c; }
      .primary:disabled { cursor: wait; opacity: .55; }
      .secondary { color: #174a7e; background: #e8f0f8; }
      .ghost { color: #536277; background: transparent; border: 1px solid #ccd5e1; }
      .error { margin: 14px 0 0; color: #b42318; font-weight: 700; }
      .top-actions { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; padding: 18px 20px; }
      .judge-name { margin: 0; font-size: 1.08rem; font-weight: 900; }
      .judge-meta { margin: 3px 0 0; color: #607087; font-size: .9rem; }
      .toolbar { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px; margin: 18px 0; }
      .progress { color: #536277; font-weight: 750; white-space: nowrap; }
      .team-grid { display: grid; gap: 13px; }
      .team-card { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; padding: 19px 20px; }
      .team-code { margin: 0; font-size: 1.12rem; font-weight: 950; letter-spacing: .01em; }
      .team-name { margin: 3px 0 0; color: #45566d; font-weight: 750; }
      .members { margin: 10px 0 0; padding-left: 20px; color: #66758a; line-height: 1.55; }
      .team-action { min-width: 150px; text-align: right; }
      .pill { display: inline-block; margin-bottom: 8px; border-radius: 999px; padding: 5px 9px; color: #166534; background: #dcfce7; font-size: .78rem; font-weight: 900; }
      .empty { padding: 30px; text-align: center; color: #66758a; }
      .modal-backdrop {
        position: fixed; inset: 0; display: none; place-items: center; z-index: 20;
        padding: 18px; background: rgba(10,24,43,.62); overflow-y: auto;
      }
      .modal-backdrop.open { display: grid; }
      .modal { width: min(100%, 560px); padding: 24px; }
      .modal h2 { margin: 0 0 4px; }
      .modal-team { margin: 0; color: #65758a; }
      .rubric-grid { display: grid; margin-top: 14px; }
      .rubric-item { display: grid; grid-template-columns: 1fr 110px; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid #e8edf3; }
      .rubric-item label { margin: 0 0 4px; }
      .rubric-item p { margin: 0; color: #718095; font-size: .78rem; line-height: 1.4; }
      .rubric-score { display: flex; align-items: center; gap: 7px; color: #718095; font-size: .75rem; }
      .rubric-score input { text-align: center; font-weight: 850; }
      .overall { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; padding: 15px 17px; border: 1px solid #f0dfbd; border-radius: 14px; background: #fff8ea; }
      .overall strong { color: #9c4932; font-size: 1.55rem; }
      .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
      .modal-actions .primary { margin: 0; }
      .save-status { min-height: 22px; margin: 12px 0 0; color: #166534; font-weight: 750; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
      [hidden] { display: none !important; }
      @media (max-width: 620px) {
        .shell { padding: 18px 13px 42px; }
        .login { margin-top: 3vh; padding: 22px; }
        .brand { display: block; }
        .toolbar { grid-template-columns: 1fr; }
        .team-card { grid-template-columns: 1fr; gap: 13px; }
        .team-action { text-align: left; }
        .team-action button { width: 100%; }
        .rubric-item { grid-template-columns: 1fr; }
        .rubric-score { width: 125px; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="brand">
        <div>
          <p class="eyebrow">LifeHack 2026</p>
          <h1>Judging Portal</h1>
          <p class="subtitle">Your assigned teams and scoring workspace.</p>
        </div>
      </div>

      <section id="loginView" class="card login">
        <h2>Judge login</h2>
        <p class="subtitle">Use the username and password issued by the organising committee.</p>
        <form id="loginForm">
          <label for="username">Username</label>
          <input id="username" autocomplete="username" autocapitalize="none" required>
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
          <button id="loginButton" class="primary" type="submit">Log in</button>
          <p id="loginError" class="error" role="alert"></p>
        </form>
      </section>

      <section id="portalView" hidden>
        <div class="card top-actions">
          <div>
            <p id="judgeName" class="judge-name"></p>
            <p id="judgeMeta" class="judge-meta"></p>
          </div>
          <button class="ghost" type="button" onclick="logout()">Log out</button>
        </div>

        <div class="toolbar">
          <div>
            <label class="sr-only" for="teamSearch">Search teams</label>
            <input id="teamSearch" type="search" placeholder="Search team code, name, or member">
          </div>
          <div id="progress" class="progress"></div>
        </div>

        <div id="teamGrid" class="team-grid"></div>
      </section>
    </main>

    <div id="scoreBackdrop" class="modal-backdrop" role="presentation">
      <section class="card modal" role="dialog" aria-modal="true" aria-labelledby="scoreTitle">
        <h2 id="scoreTitle">Judge team</h2>
        <p id="scoreTeam" class="modal-team"></p>
        <form id="scoreForm">
          <input id="scoreTeamCode" type="hidden">
          <div id="rubricGrid" class="rubric-grid"></div>
          <div class="overall"><span>Overall score<br><small>Average of all five criteria</small></span><strong><span id="overallPreview">—</span>/10</strong></div>
          <label for="comments">Comments <span class="subtitle">(optional)</span></label>
          <textarea id="comments" maxlength="2000" placeholder="Notes for the organising committee"></textarea>
          <p id="saveStatus" class="save-status" role="status"></p>
          <div class="modal-actions">
            <button class="ghost" type="button" onclick="closeScoreModal()">Cancel</button>
            <button id="saveButton" class="primary" type="submit">Save result</button>
          </div>
        </form>
      </section>
    </div>

    <script>
      var portalState = { token: "", judge: null, teams: [], scoreMaximum: 10, criteria: [] };

      document.getElementById("loginForm").addEventListener("submit", function (event) {
        event.preventDefault();
        login();
      });
      document.getElementById("scoreForm").addEventListener("submit", function (event) {
        event.preventDefault();
        saveScore();
      });
      document.getElementById("teamSearch").addEventListener("input", renderTeams);
      document.getElementById("scoreBackdrop").addEventListener("click", function (event) {
        if (event.target === this) closeScoreModal();
      });

      function login() {
        var username = document.getElementById("username").value.trim();
        var password = document.getElementById("password").value;
        var button = document.getElementById("loginButton");
        setBusy(button, true, "Logging in...");
        document.getElementById("loginError").textContent = "";

        google.script.run
          .withSuccessHandler(function (data) {
            setBusy(button, false, "Log in");
            acceptPortalData(data);
          })
          .withFailureHandler(function (failure) {
            setBusy(button, false, "Log in");
            document.getElementById("loginError").textContent = failureMessage(failure);
          })
          .judgeLogin(username, password);
      }

      function resumeSession() {
        var token = sessionStorage.getItem("lifehackJudgeToken") || "";
        if (!token) return;
        google.script.run
          .withSuccessHandler(acceptPortalData)
          .withFailureHandler(function () {
            sessionStorage.removeItem("lifehackJudgeToken");
          })
          .judgeRefresh(token);
      }

      function acceptPortalData(data) {
        portalState = data;
        sessionStorage.setItem("lifehackJudgeToken", data.token);
        document.getElementById("password").value = "";
        document.getElementById("loginView").hidden = true;
        document.getElementById("portalView").hidden = false;
        document.getElementById("judgeName").textContent = data.judge.name;
        document.getElementById("judgeMeta").textContent =
          data.judge.type + " | " + data.judge.problemStatement + " | " + data.judge.category;
        renderRubricInputs();
        renderTeams();
      }

      function renderTeams() {
        var query = document.getElementById("teamSearch").value.trim().toLowerCase();
        var grid = document.getElementById("teamGrid");
        grid.replaceChildren();
        var submittedCount = portalState.teams.filter(function (team) { return !!team.saved; }).length;
        document.getElementById("progress").textContent =
          submittedCount + " of " + portalState.teams.length + " scored";

        var visibleTeams = portalState.teams.filter(function (team) {
          var haystack = [team.teamCode, team.teamName].concat(team.members).join(" ").toLowerCase();
          return !query || haystack.indexOf(query) !== -1;
        });
        if (!visibleTeams.length) {
          var empty = document.createElement("div");
          empty.className = "card empty";
          empty.textContent = "No matching teams.";
          grid.appendChild(empty);
          return;
        }

        visibleTeams.forEach(function (team) {
          var card = document.createElement("article");
          card.className = "card team-card";
          var details = document.createElement("div");
          var code = document.createElement("h2");
          code.className = "team-code";
          code.textContent = team.teamCode;
          details.appendChild(code);
          if (team.teamName) {
            var name = document.createElement("p");
            name.className = "team-name";
            name.textContent = team.teamName;
            details.appendChild(name);
          }
          var members = document.createElement("ul");
          members.className = "members";
          team.members.forEach(function (member) {
            var item = document.createElement("li");
            item.textContent = member;
            members.appendChild(item);
          });
          details.appendChild(members);

          var action = document.createElement("div");
          action.className = "team-action";
          if (team.saved) {
            var pill = document.createElement("div");
            pill.className = "pill";
            pill.textContent = "Saved | " + team.saved.overallScore + "/" + portalState.scoreMaximum;
            action.appendChild(pill);
          }
          var button = document.createElement("button");
          button.className = "secondary";
          button.type = "button";
          button.textContent = team.saved ? "Edit score" : "Judge team";
          button.addEventListener("click", function () { openScoreModal(team.teamCode); });
          action.appendChild(button);
          card.appendChild(details);
          card.appendChild(action);
          grid.appendChild(card);
        });
      }

      function renderRubricInputs() {
        var grid = document.getElementById("rubricGrid");
        grid.replaceChildren();
        portalState.criteria.forEach(function (criterion) {
          var item = document.createElement("div");
          item.className = "rubric-item";
          var copy = document.createElement("div");
          var label = document.createElement("label");
          label.htmlFor = "score_" + criterion.key;
          label.textContent = criterion.label;
          var description = document.createElement("p");
          description.textContent = criterion.description;
          copy.appendChild(label);
          copy.appendChild(description);
          var score = document.createElement("div");
          score.className = "rubric-score";
          var input = document.createElement("input");
          input.id = "score_" + criterion.key;
          input.type = "number";
          input.min = "0";
          input.max = String(portalState.scoreMaximum);
          input.step = "0.5";
          input.inputMode = "decimal";
          input.required = true;
          input.addEventListener("input", updateOverallPreview);
          var maximum = document.createElement("span");
          maximum.textContent = "/ " + portalState.scoreMaximum;
          score.appendChild(input);
          score.appendChild(maximum);
          item.appendChild(copy);
          item.appendChild(score);
          grid.appendChild(item);
        });
      }

      function updateOverallPreview() {
        var values = portalState.criteria.map(function (criterion) {
          return document.getElementById("score_" + criterion.key).value;
        });
        if (!values.length || values.some(function (value) { return value === ""; })) {
          document.getElementById("overallPreview").textContent = "—";
          return;
        }
        var total = values.reduce(function (sum, value) { return sum + Number(value); }, 0);
        document.getElementById("overallPreview").textContent =
          (total / values.length).toFixed(1);
      }

      function openScoreModal(teamCode) {
        var team = portalState.teams.find(function (item) { return item.teamCode === teamCode; });
        if (!team) return;
        document.getElementById("scoreTeamCode").value = team.teamCode;
        document.getElementById("scoreTeam").textContent =
          team.teamCode + (team.teamName ? " | " + team.teamName : "");
        portalState.criteria.forEach(function (criterion) {
          var savedValue = team.saved && team.saved.criterionScores
            ? team.saved.criterionScores[criterion.key]
            : "";
          document.getElementById("score_" + criterion.key).value =
            savedValue === undefined ? "" : savedValue;
        });
        updateOverallPreview();
        document.getElementById("comments").value = team.saved ? team.saved.comments : "";
        document.getElementById("saveStatus").textContent = "";
        document.getElementById("scoreBackdrop").classList.add("open");
        setTimeout(function () {
          if (portalState.criteria.length) {
            document.getElementById("score_" + portalState.criteria[0].key).focus();
          }
        }, 0);
      }

      function closeScoreModal() {
        document.getElementById("scoreBackdrop").classList.remove("open");
      }

      function saveScore() {
        var teamCode = document.getElementById("scoreTeamCode").value;
        var comments = document.getElementById("comments").value;
        var button = document.getElementById("saveButton");
        var status = document.getElementById("saveStatus");
        status.textContent = "";
        status.style.color = "#166534";
        setBusy(button, true, "Saving...");

        var submission = { teamCode: teamCode, comments: comments };
        portalState.criteria.forEach(function (criterion) {
          submission[criterion.key] = document.getElementById("score_" + criterion.key).value;
        });

        google.script.run
          .withSuccessHandler(function (result) {
            setBusy(button, false, "Save result");
            var team = portalState.teams.find(function (item) { return item.teamCode === result.teamCode; });
            if (team) {
              team.saved = {
                criterionScores: result.criterionScores,
                overallScore: result.overallScore,
                comments: result.comments,
                updatedAt: result.updatedAt,
              };
            }
            status.style.color = "#166534";
            status.textContent = "Saved successfully.";
            renderTeams();
            setTimeout(closeScoreModal, 650);
          })
          .withFailureHandler(function (failure) {
            setBusy(button, false, "Save result");
            status.textContent = failureMessage(failure);
            status.style.color = "#b42318";
          })
          .judgeSaveScore(portalState.token, submission);
      }

      function logout() {
        var token = portalState.token;
        sessionStorage.removeItem("lifehackJudgeToken");
        portalState = { token: "", judge: null, teams: [], scoreMaximum: 10, criteria: [] };
        document.getElementById("portalView").hidden = true;
        document.getElementById("loginView").hidden = false;
        if (token) google.script.run.judgeLogout(token);
      }

      function setBusy(button, busy, text) {
        button.disabled = busy;
        button.textContent = text;
      }

      function failureMessage(failure) {
        return failure && failure.message ? failure.message : String(failure || "Something went wrong.");
      }

      resumeSession();
    </script>
  </body>
</html>
